<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>INTERN Combat Prototype</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #111; color: #ccc; font-family: monospace; font-size: 14px; padding: 16px; }
    #log { white-space: pre-wrap; height: 70vh; overflow-y: auto; border: 1px solid #333; padding: 10px; margin-bottom: 10px; }
    #input-row { display: flex; gap: 8px; }
    #cmd { flex: 1; background: #222; color: #eee; border: 1px solid #444; padding: 6px 10px; font-family: monospace; font-size: 14px; }
    button { background: #333; color: #eee; border: 1px solid #555; padding: 6px 16px; cursor: pointer; font-family: monospace; }
    button:hover { background: #444; }
  </style>
</head>
<body>
  <div id="log"></div>
  <div id="input-row">
    <input id="cmd" type="text" placeholder="카드 번호 입력 (공백 구분) — 빈 입력 = 턴 종료" autocomplete="off" />
    <button id="btn">확인</button>
  </div>
  <script src="game.js"></script>
</body>
</html>
